name: Sync to Self-Hosted GitLab

on:
  push:
    branches:
      - '*'
  delete:
  create:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        run: |
          # 提取你的域名与仓库路径，转换为 HTTPS 地址
          GITLAB_REPO="gitlab.lingolift.cn/lingoforest/photosynthesis-chat.git"

          git remote add gitlab "https://oauth2:${{ secrets.GITLAB_TOKEN }}@${GITLAB_REPO}"
          git push gitlab --all --force
          git push gitlab --tags --force
